<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Gas</title>
    <!-- Configuración para PWA en iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Gas">
    <!-- --- Íconos (Actualizado para representar 'gas.png' con un placeholder) --- -->
    <link rel="apple-touch-icon" href="gas.png">
    <link rel="icon" href="gas.png">
    
    <!-- Tailwind CSS CDN para un estilo limpio y adaptable -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilo personalizado para iOS-like feel */
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: #f7f7f7; /* Fondo muy claro */
            padding-bottom: 6rem; /* Espacio para que el contenido no se oculte bajo la barra de navegación (si la hubiera) */
        }
        /* Estilo para los cards y elementos principales */
        .ios-card {
            background-color: white;
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
        }
        /* Botón primario estilo iOS */
        .ios-button {
            transition: background-color 0.1s;
            font-weight: 600;
        }
        .ios-button:active {
            filter: brightness(0.95);
        }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-8">

    <!-- Contenedor Principal -->
    <div class="max-w-xl mx-auto">
        <h1 class="text-4xl font-bold mt-4 mb-8 text-gray-900">Registro de balones de gas</h1>
        
        <!-- Mensajes del sistema (Errores, Confirmaciones) -->
        <div id="system-message" class="hidden p-3 mb-4 rounded-lg text-sm font-medium" role="alert"></div>

        <!-- Sección de Balón de Gas Actual (Activo) -->
        <div id="active-tank-container" class="ios-card p-4 mb-6">
            <h2 class="text-2xl font-semibold mb-3 text-gray-800 flex items-center">
                Balón actual
            </h2>
            <div id="active-tank-display">
                <!-- Se llenará con la info del balón activo o un mensaje -->
                <p class="text-gray-500 italic">Cargando datos...</p>
            </div>
        </div>

        <!-- Formulario para Nuevo Balón -->
        <div class="ios-card p-4 mb-6">
            <h2 class="text-2xl font-semibold mb-3 text-gray-800">Nuevo balón</h2>
            <form id="new-tank-form" class="space-y-4">
                <div>
                    <label for="purchaseDate" class="block text-sm font-medium text-gray-700 mb-1">Fecha de compra</label>
                    <input type="date" id="purchaseDate" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="openDate" class="block text-sm font-medium text-gray-700 mb-1">Fecha de apertura (uso)</label>
                    <input type="date" id="openDate" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <button type="submit" id="add-tank-btn"
                        class="ios-button w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 disabled:bg-gray-400">
                    Guardar nuevo balón
                </button>
            </form>
        </div>

        <!-- Historial de Registros -->
        <div class="ios-card p-4">
            <h2 class="text-2xl font-semibold mb-4 text-gray-800">Historial de uso</h2>
            <div id="history-list" class="space-y-3">
                <!-- Se llenará con los registros históricos -->
                <p class="text-gray-500 italic">El historial aparecerá aquí.</p>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmación para Borrar -->
    <div id="delete-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center p-4 z-50">
        <div class="ios-card p-6 w-full max-w-sm">
            <h3 class="text-xl font-semibold mb-4">Confirmar eliminación</h3>
            <p class="text-gray-700 mb-6">¿Estás seguro de que quieres eliminar este registro histórico?</p>
            <div class="flex justify-end space-x-3">
                <button id="cancel-delete-btn" class="ios-button px-4 py-2 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200">
                    Cancelar
                </button>
                <button id="confirm-delete-btn" class="ios-button px-4 py-2 text-white bg-red-500 rounded-lg hover:bg-red-600">
                    Eliminar
                </button>
            </div>
        </div>
    </div>


    <!-- Script de Local Storage y Lógica -->
    <script>
        
        // --- Referencias del DOM ---
        const form = document.getElementById('new-tank-form');
        const activeTankContainer = document.getElementById('active-tank-display');
        const historyList = document.getElementById('history-list');
        const systemMessage = document.getElementById('system-message');
        const addTankBtn = document.getElementById('add-tank-btn');
        const deleteModal = document.getElementById('delete-modal');
        const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
        const cancelDeleteBtn = document.getElementById('cancel-delete-btn');

        let tankToDeleteId = null;

        // --- Funciones de Local Storage ---

        /**
         * Carga los registros de gas desde el almacenamiento local.
         * @returns {Array<Object>} Lista de balones de gas.
         */
        const getTanksFromStorage = () => {
            try {
                const stored = localStorage.getItem('gasTanks');
                // Devolver un array vacío si no hay datos o si falla el parseo
                return stored ? JSON.parse(stored) : [];
            } catch (e) {
                console.error("Error al cargar datos de localStorage:", e);
                return [];
            }
        };

        /**
         * Guarda la lista de balones de gas en el almacenamiento local.
         * @param {Array<Object>} tanks - Lista de balones a guardar.
         */
        const saveTanksToStorage = (tanks) => {
            try {
                localStorage.setItem('gasTanks', JSON.stringify(tanks));
            } catch (e) {
                console.error("Error al guardar datos en localStorage:", e);
                showMessage("Error al guardar datos. El almacenamiento local puede estar lleno.", 'error');
            }
        };

        /**
         * Muestra un mensaje temporal al usuario (en minúsculas/sentencia).
         * @param {string} message - El texto del mensaje.
         * @param {string} type - El tipo ('success', 'error', 'info').
         */
        const showMessage = (message, type) => {
            let bgColor = '';
            let textColor = '';
            switch (type) {
                case 'success':
                    bgColor = 'bg-green-100 border border-green-400';
                    textColor = 'text-green-700';
                    break;
                case 'error':
                    bgColor = 'bg-red-100 border border-red-400';
                    textColor = 'text-red-700';
                    break;
                default:
                    bgColor = 'bg-blue-100 border border-blue-400';
                    textColor = 'text-blue-700';
            }
            systemMessage.textContent = message;
            systemMessage.className = `p-3 mb-4 rounded-lg text-sm font-medium ${bgColor} ${textColor} block`;
            setTimeout(() => {
                systemMessage.classList.add('hidden');
            }, 5000);
        };

        // Función auxiliar para formatear fechas
        const formatDate = (isoString) => {
            if (!isoString) return 'N/A';
            const date = new Date(isoString + 'T00:00:00'); // Usar T00:00:00 para evitar problemas de zona horaria
            return date.toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });
        };
        
        /**
         * Calcula la diferencia de días entre dos fechas (ISO string o Date object).
         */
        const calculateDaysDiff = (date1, date2) => {
            const d1 = date1 instanceof Date ? date1 : new Date(date1 + 'T00:00:00');
            const d2 = date2 instanceof Date ? date2 : new Date(date2 + 'T00:00:00');

            const diffTime = Math.abs(d1.getTime() - d2.getTime());
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
        };

        /**
         * Renderiza la información del balón activo y el historial.
         * @param {Array} tanks - Lista de documentos del gas.
         */
        function renderTanks(tanks) {
            // 1. Clasificar y ordenar los balones (más reciente primero)
            const sortedTanks = [...tanks].sort((a, b) => new Date(b.openDate) - new Date(a.openDate));
            
            const activeTank = sortedTanks.find(tank => tank.status === 'active');
            const history = sortedTanks.filter(tank => tank.status === 'closed');
            
            // Fecha de hoy para establecer el valor predeterminado del campo de cierre
            const todayISO = new Date().toISOString().split('T')[0];


            // 2. Renderizar el Balón Actual
            if (activeTank) {
                const openDate = activeTank.openDate;
                const today = new Date().toISOString().split('T')[0];
                const currentUsageDays = calculateDaysDiff(today, openDate);
                
                activeTankContainer.innerHTML = `
                    <form id="close-tank-form" data-tank-id="${activeTank.id}" data-open-date="${activeTank.openDate}">
                        <div class="flex flex-col space-y-2 text-lg mb-4">
                            <p><strong>Días de uso actual:</strong> <span class="text-blue-600 font-bold text-2xl">${currentUsageDays} días</span></p>
                            <p><span class="text-gray-500">Comprado:</span> ${formatDate(activeTank.purchaseDate)}</p>
                            <p><span class="text-gray-500">Abierto:</span> ${formatDate(activeTank.openDate)}</p>
                        </div>
                        
                        <div class="space-y-3 pt-3 border-t border-gray-100">
                            <label for="closeDateManual" class="block text-sm font-medium text-gray-700">Fecha de cierre manual</label>
                            <input type="date" id="closeDateManual" required 
                                   value="${todayISO}"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-red-500 focus:border-red-500">
                        </div>

                        <button type="submit" id="close-tank-submit-btn"
                                class="ios-button mt-4 w-full bg-red-500 text-white py-3 rounded-lg hover:bg-red-600">
                            Registrar cierre
                        </button>
                    </form>
                `;
                // Asignar el listener al formulario de cierre
                document.getElementById('close-tank-form').addEventListener('submit', handleCloseTankSubmit);

            } else {
                activeTankContainer.innerHTML = `
                    <div class="p-3 bg-green-50 text-green-700 rounded-lg text-center">
                        ¡No hay balón activo! Puedes añadir uno nuevo en la sección de abajo.
                    </div>
                `;
            }

            // 3. Renderizar el Historial
            if (history.length > 0) {
                historyList.innerHTML = history.map(tank => `
                    <div class="flex items-start justify-between p-3 border-b last:border-b-0">
                        <div class="text-sm space-y-1">
                            <p class="font-medium text-gray-800">Días de uso: <span class="text-indigo-600 font-semibold">${tank.usageDays}</span></p>
                            <p class="text-xs text-gray-500"><span class="font-medium text-gray-700">Abierto:</span> ${formatDate(tank.openDate)}</p>
                            <p class="text-xs text-gray-500"><span class="font-medium text-gray-700">Cerrado:</span> ${formatDate(tank.closeDate)}</p>
                        </div>
                        <button data-id="${tank.id}" class="delete-btn text-gray-400 hover:text-red-500 p-2 rounded-full transition-colors flex-shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 10-2 0v6a1 1 0 102 0V8z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </div>
                `).join('');
                
                // Asignar listeners de eliminación
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        tankToDeleteId = e.currentTarget.dataset.id;
                        deleteModal.classList.remove('hidden');
                        deleteModal.classList.add('flex');
                    });
                });
            } else {
                historyList.innerHTML = '<p class="p-3 text-gray-500 italic text-center">Aún no hay registros históricos cerrados.</p>';
            }
        }

        /**
         * Inicializa la aplicación cargando los datos de localStorage.
         */
        function initializeApp() {
            // Inicia la aplicación cargando datos y renderizando
            renderTanks(getTanksFromStorage());
        }
        
        /**
         * Maneja el envío del formulario para agregar un nuevo balón.
         */
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            addTankBtn.disabled = true;
            addTankBtn.textContent = 'Guardando...';

            const purchaseDate = document.getElementById('purchaseDate').value;
            const openDate = document.getElementById('openDate').value;
            
            // Validación simple
            if (new Date(openDate) < new Date(purchaseDate)) {
                showMessage("La fecha de apertura no puede ser anterior a la fecha de compra.", 'error');
                addTankBtn.disabled = false;
                addTankBtn.textContent = 'Guardar nuevo balón';
                return;
            }
            
            const newTank = {
                id: Date.now().toString(), // Generar un ID simple para Local Storage
                purchaseDate: purchaseDate, // Almacenar como string ISO Date
                openDate: openDate,         // Almacenar como string ISO Date
                closeDate: null,
                usageDays: null,
                status: 'active', // Estado inicial
                createdAt: new Date().toISOString()
            };

            try {
                const tanks = getTanksFromStorage();
                
                // Comprobar si ya hay un balón activo (solo se permite uno)
                if (tanks.some(tank => tank.status === 'active')) {
                    showMessage("Ya existe un balón activo. Por favor, regístrelo como 'Cerrado' antes de añadir uno nuevo.", 'error');
                } else {
                    tanks.push(newTank);
                    saveTanksToStorage(tanks);
                    showMessage("Nuevo balón activo guardado con éxito.", 'success');
                    form.reset();
                    renderTanks(tanks);
                }
            } catch (error) {
                console.error("Error al agregar el balón a localStorage:", error);
                showMessage("Error al guardar el nuevo balón.", 'error');
            } finally {
                addTankBtn.disabled = false;
                addTankBtn.textContent = 'Guardar nuevo balón';
            }
        });

        /**
         * Maneja el envío del formulario para cerrar el balón activo con una fecha manual.
         */
        function handleCloseTankSubmit(e) {
            e.preventDefault();
            
            const form = e.currentTarget;
            const tankId = form.dataset.tankId;
            const openDateString = form.dataset.openDate;
            const closeDateString = document.getElementById('closeDateManual').value;
            
            const closeBtn = document.getElementById('close-tank-submit-btn');
            closeBtn.disabled = true;
            closeBtn.textContent = 'Cerrando...';
            
            if (!tankId) {
                showMessage("Id del balón faltante. Recargue la aplicación.", 'error');
                closeBtn.disabled = false;
                closeBtn.textContent = 'Registrar cierre';
                return;
            }

            const openDate = new Date(openDateString);
            const closeDate = new Date(closeDateString);
            
            // Validación: La fecha de cierre no puede ser anterior a la fecha de apertura
            if (closeDate < openDate) {
                showMessage("La fecha de cierre no puede ser anterior a la fecha de apertura.", 'error');
                closeBtn.disabled = false;
                closeBtn.textContent = 'Registrar cierre';
                return;
            }

            try {
                let tanks = getTanksFromStorage();
                const tankIndex = tanks.findIndex(t => t.id === tankId);

                if (tankIndex > -1) {
                    // Recalcular los días de uso en base a la fecha de cierre manual
                    const usageDays = calculateDaysDiff(closeDateString, openDateString);
                    
                    // Actualizar el estado y los datos
                    tanks[tankIndex].closeDate = closeDateString; // Guardar la fecha manual
                    tanks[tankIndex].usageDays = usageDays;
                    tanks[tankIndex].status = 'closed';
                    
                    saveTanksToStorage(tanks);
                    showMessage(`Balón cerrado. Días de uso registrados: ${usageDays} días.`, 'success');
                    renderTanks(tanks);
                } else {
                    showMessage("Balón activo no encontrado.", 'error');
                }

            } catch (error) {
                console.error("Error al registrar el cierre del balón en localStorage:", error);
                showMessage("Error al cerrar el balón de gas.", 'error');
            } finally {
                closeBtn.disabled = false;
                closeBtn.textContent = 'Registrar cierre';
            }
        }
        
        // --- Lógica del Modal de Eliminación ---

        confirmDeleteBtn.addEventListener('click', () => {
            if (!tankToDeleteId) return;

            try {
                let tanks = getTanksFromStorage();
                const initialLength = tanks.length;
                
                // Filtrar y guardar solo los que NO coinciden con el ID
                tanks = tanks.filter(t => t.id !== tankToDeleteId);
                
                if (tanks.length < initialLength) {
                    saveTanksToStorage(tanks);
                    showMessage("Registro eliminado con éxito.", 'success');
                    renderTanks(tanks);
                } else {
                    showMessage("Error: Registro no encontrado para eliminar.", 'error');
                }

            } catch (error) {
                console.error("Error al eliminar el documento de localStorage:", error);
                showMessage("Error al eliminar el registro.", 'error');
            } finally {
                tankToDeleteId = null;
                deleteModal.classList.add('hidden');
                deleteModal.classList.remove('flex');
            }
        });

        cancelDeleteBtn.addEventListener('click', () => {
            tankToDeleteId = null;
            deleteModal.classList.add('hidden');
            deleteModal.classList.remove('flex');
        });

        // Iniciar la aplicación al cargar la página
        initializeApp();
        
    </script>
</body>
</html>
